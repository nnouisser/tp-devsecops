
name: CI/CD - democyber

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Run Gitleaks scan
        uses: zricethezav/gitleaks-action@v2
        
        # Upload the Gitleaks report
      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Java project with Maven
        run: mvn -B clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Build Docker image
      - name: Build Docker image
        run: docker build -t democyber:latest .

      # Build Docker image
      - name: Build Docker image
        run: docker build -t democyber:latest .

      # Test Docker image locally
      - name: Test Docker image locally
        run: |
          docker run -d --name democyber-test -p 8080:8080 democyber:latest
          sleep 10
          curl -f http://localhost:8080 || echo "App not responding"
          docker stop democyber-test
          docker rm democyber-test

      # Trivy scan
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: democyber:latest
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
