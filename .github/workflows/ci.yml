name: CI/CD - democyber

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gitleaks scan
        uses: zricethezav/gitleaks-action@v2
        
      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Java project with Maven
        run: mvn -B clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      # J'ai ajouté ton username docker en préfixe pour que le push fonctionne
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest .

      - name: Test Docker image locally
        run: |
          docker run -d --name democyber-test -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest
          sleep 10
          curl -f http://localhost:8080 || echo "App not responding"
          docker stop democyber-test
          docker rm democyber-test

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest
          format: 'json'
          output: 'trivy-results.json' # AJOUTÉ : crée le fichier
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # AJOUTÉ : Sauvegarde du rapport Trivy même si le scan échoue
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.json

      # AJOUTÉ : Étape pour pousser l'image sur Docker Hub
      # Note : Elle ne s'exécutera que si le build et les tests réussissent.
      # Si Trivy échoue, tu devras peut-être mettre exit-code: '0' temporairement pour tester le push.
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest